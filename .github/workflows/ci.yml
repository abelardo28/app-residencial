name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Pruebas (API y reglas compartidas)
        run: npm test
      - name: Compilar APP
        run: npm run build
      - name: Compilar APP (modo demo)
        run: npm run build:demo
