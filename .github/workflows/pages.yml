# Publica la demo (datos en el navegador, sin servidor) en GitHub Pages en cada push a main.
# Actívalo una vez en Settings → Pages → Source: GitHub Actions.
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rutas relativas: la demo vive en https://USUARIO.github.io/app-residencial/
      - run: node scripts/copy-ocr-assets.mjs && npx vite build --mode demo --base ./
        working-directory: apps/web
      # iPhone guarda mal la ruta si es relativa al «Agregar a inicio»: la fijamos a /app-residencial/
      - run: sed -i 's#"\./"#"/${{ github.event.repository.name }}/"#g' apps/web/dist/manifest.webmanifest && grep -E '"(id|start_url|scope)"' apps/web/dist/manifest.webmanifest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
